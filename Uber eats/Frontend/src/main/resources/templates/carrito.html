<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - FEIFood</title>
    <link rel="stylesheet" href="styles/carrito.css">
    <link rel="stylesheet" href="styles/sesion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <a href="#" onclick="getMain()" class="logo"><i class="fas fa-utensils"></i> FEIFood</a>
        
        <h1>Carrito de Compras</h1>
        
        <div class="user-menu">
            <i class="fas fa-user" onclick="toggleUserMenu()"></i>
            <div class="dropdown-menu" id="userMenu">
                <a href="#" onclick="profile()"> <i style="color:white; padding: 5%;" class="fas fa-user-circle"></i> Mi perfil</a>
                <a href="#" onclick="help()"> <i style="color:white; padding: 5%;" class="fas fa-question-circle"></i> Ayuda</a>
                <a href="#" onclick="logout()"> <i style="color:white; padding: 5%;" class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </div>
        </div>
    </header>

    <section id="cart-items" class="food-container"></section>

    <footer>
        <div id="cart-total">
            <h2>Total: $<span id="total-amount">0.00</span></h2>
            <button id="checkout-button" onclick="checkout()">Solicitar comida</button>
        </div>
    </footer>
    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
