<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página principal</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
</head>
<body>
    <header>
        <a href="#" class="logo"><i class="fas fa-utensils"></i> FEIFood</a>
        <div id="mapOptions">
            <button onclick="showMap()" id="locationButton">
                <i class="fas fa-map-marker-alt map-color"></i> Seleccionar ubicación
            </button>
            <div id="coordinates" style="display: none;"> 
                <p id="latLngText"></p>
            </div>
        </div>
        <input type="text" id="searchBar" placeholder="Buscar alimentos o restaurantes..." oninput="filterItems()">
        <div class="user-menu">
            <i class="fas fa-user" onclick="toggleUserMenu()"></i>
            <div class="dropdown-menu" id="userMenu">
                <a href="#" onclick="profile()" style="color:white;">Mi perfil</a>
                <a href="#" onclick="help()" style="color:white;">Ayuda</a>
                <a href="#" onclick="logout()" style="color:white;">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <div class="tags">
        <button onclick="filterByTag('Pizza')">Pizza</button>
        <button onclick="filterByTag('Hamburguesa')">Hamburguesa</button>
        <button onclick="filterByTag('Sushi')">Sushi</button>
        <button onclick="filterByTag('Ensalada')">Ensalada</button>
        <button onclick="filterByTag('Postre')">Postre</button>
        <button onclick="filterByTag('Todos')">Todos</button>
    </div>

    <section class="food-container" id="foodContainer"></section>

    <div id="mapContainer" style="display: none; height: 50%; width: 25%; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background-color: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);">
        <button onclick="closeMap()" id="closeMapButton" 
                style="position: absolute; top: 10px; right: 10px; background-color: rgba(255, 255, 255, 0.7); border: none; border-radius: 50%; padding: 10px; cursor: pointer; font-size: 16px;">
            X
        </button>
        <div id="map" style="height: 100%; width: 100%;"></div>
    </div>    

    <!-- Mapbox JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
        // Tu token de Mapbox
        mapboxgl.accessToken = 'pk.eyJ1Ijoic2hhZG93aW1wb3N0b3IwMSIsImEiOiJjbTVsZ2R2MDAxcjNkMmxxMmRrcmE4anM0In0.wT1IJKpPs4yaTHHeMbqklw';

        let map;

        function showMap() {
            const mapContainer = document.getElementById("mapContainer");
            const coordinatesDiv = document.getElementById("coordinates");
            const latLngText = document.getElementById("latLngText");

            mapContainer.style.display = "block";
            coordinatesDiv.style.display = "block";

            if (!map) {
                // Coordenadas predeterminadas
                const defaultCoordinates = [-96.9275, 19.5411]; // Xalapa

                // Crear mapa
                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v11',
                    center: defaultCoordinates,
                    zoom: 14
                });

                // Marcador inicial
                const marker = new mapboxgl.Marker({ draggable: true })
                    .setLngLat(defaultCoordinates)
                    .addTo(map);

                // Actualizar coordenadas al mover el marcador
                marker.on('dragend', () => {
                    const lngLat = marker.getLngLat();
                    latLngText.innerHTML = `Lat: ${lngLat.lat}<br>Lng: ${lngLat.lng}`;
                });

                // Ubicación del usuario
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userCoordinates = [position.coords.longitude, position.coords.latitude];
                        map.setCenter(userCoordinates);
                        marker.setLngLat(userCoordinates);
                        latLngText.innerHTML = `Lat: ${position.coords.latitude}<br>Lng: ${position.coords.longitude}`;
                    },
                    () => {
                        // Si no se puede obtener la ubicación, usar las coordenadas predeterminadas
                        alert("No se pudo obtener tu ubicación. Mostrando ubicación predeterminada (Xalapa).");
                        latLngText.innerHTML = `Lat: ${defaultCoordinates[1]}<br>Lng: ${defaultCoordinates[0]}`;
                    }
                );
            }
        }

        function closeMap() {
            const mapContainer = document.getElementById("mapContainer");
            mapContainer.style.display = "none";
        }
    </script>
</body>
</html>
