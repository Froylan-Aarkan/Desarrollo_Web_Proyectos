<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Repartidor - FEIFood</title>
    <link rel="stylesheet" href="styles/sesion.css">
    <link rel="stylesheet" href="styles/mainRepartidor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
</head>
<body>
    <header>
        <a href="#" class="logo"><i class="fas fa-utensils"></i> FEIFood</a>
        
        <h1>Panel de Repartidor</h1>
        
        <div class="user-menu">
            <i class="fas fa-user" onclick="toggleUserMenu()"></i>
            <div class="dropdown-menu" id="userMenu">
                <a href="#" onclick="profile()"> <i style="color:white; padding: 5%;" class="fas fa-user-circle"></i> Mi perfil</a>
                <a href="#" onclick="help()"> <i style="color:white; padding: 5%;" class="fas fa-question-circle"></i> Ayuda</a>
                <a href="#" onclick="logout()"> <i style="color:white; padding: 5%;" class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </div>
        </div>
    </header>

    <section id="active-orders" class="food-container">
        <h2 class="food-container-title">Pedidos Pendientes</h2>
        <div id="order-list"></div>
      </section>
    
      <section id="active-orders" class="food-container">
        <h2 class="food-container-title">Pedido Aceptado</h2>
        <div id="order-list"></div>
      </section>

    <div id="mapOverlay">
        <div title="Ruta de entrega" id="mapContainer" class="mapaCuadrado">
            <button onclick="closeMap()" id="closeMapButton" class="closeContainer">x</button>
            <div id="map"></div>
        </div>
    </div>

    <script src="js/mainRepartidor.js"></script>
    <script src="js/sesion.js"></script>
</body>
</html>
